name: CI/CD

# PR: só testes. Push na main: testes -> imagem no ECR -> deploy na EC2 do Booklit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aviso
          POSTGRES_USER: aviso
          POSTGRES_PASSWORD: aviso
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U aviso -d aviso" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Cada teste de Postgres cria o próprio esquema a partir de db/*.sql. Os que dependem do
      # Floci pulam sem AVISO_TESTE_AWS_ENDPOINT e são rodados no lab (scripts/validar-floci.sh).
      - name: go test
        env:
          AVISO_TESTE_DB_URL: postgres://aviso:aviso@localhost:5433/aviso?sslmode=disable
        run: go test -race -count=1 ./...

  imagem:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      imagem: ${{ steps.tag.outputs.imagem }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - id: tag
        run: echo "imagem=${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      # Sem QEMU: o Dockerfile compila em amd64 e cruza para arm64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/arm64' }}
          push: true
          tags: |
            ${{ steps.tag.outputs.imagem }}
            ${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Os arquivos de deploy vão junto no comando: a máquina não precisa de git nem de um
      # passo manual, e o que roda lá é sempre o que está neste commit.
      - name: deploy.sh na EC2 via SSM
        env:
          INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}
          IMAGEM: ${{ needs.imagem.outputs.imagem }}
        run: |
          set -euo pipefail
          COMPOSE_B64=$(base64 -w0 deploy/compose.yaml)
          DEPLOY_B64=$(base64 -w0 deploy/deploy.sh)
          BANCO_B64=$(base64 -w0 scripts/criar-banco-prod.sh)
          COMANDO_REMOTO="install -d -m 700 /opt/client-go && echo $COMPOSE_B64 | base64 -d > /opt/client-go/compose.yaml && echo $BANCO_B64 | base64 -d > /opt/client-go/criar-banco-prod.sh && echo $DEPLOY_B64 | base64 -d > /opt/client-go/deploy.sh && chmod 700 /opt/client-go/*.sh && /opt/client-go/deploy.sh $IMAGEM"
          PARAMETROS=$(jq -n --arg c "$COMANDO_REMOTO" '{commands: [$c], executionTimeout: ["600"]}')

          COMANDO=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "client-go ${GITHUB_SHA::7}" \
            --parameters "$PARAMETROS" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $COMANDO"

          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMANDO" --instance-id "$INSTANCIA" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMANDO" --instance-id "$INSTANCIA" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $STATUS"
          test "$STATUS" = "Success"